<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UpdateApply — Auth prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="auth" aria-labelledby="headline">
        <div class="mark" aria-hidden="true" title="UpdateApply">
          <span class="mark-letter">u</span><span class="mark-plus">+</span>
        </div>

        <div class="copy" data-mode="signin">
          <h1 class="headline" id="headline">Hello again</h1>
          <p class="sub" id="sub">Sign in to continue</p>
        </div>

        <div
          class="alert"
          id="auth-error"
          role="alert"
          data-visible="false"
        >
          Sign-in didn’t finish. Check your details or try Google again.
        </div>

        <form class="form" id="auth-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@company.com"
              value="favour@updateapply.dev"
            />
          </div>

          <div class="field field-password">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              value="••••••••••"
            />
            <a class="reset-link" href="#reset" id="reset-link">Reset Password?</a>
          </div>

          <button type="submit" class="btn btn-primary" id="primary-cta">
            <span class="label-idle">Sign in</span>
            <span class="spinner" aria-hidden="true"></span>
            <span class="label-loading" hidden>Signing in…</span>
          </button>
        </form>

        <p class="switch" id="mode-switch">
          Don’t have an account?
          <button type="button" class="text-link" id="toggle-mode">Sign up</button>
        </p>

        <p class="divider" aria-hidden="true">or</p>

        <button type="button" class="btn btn-google" id="google-btn">
          <svg class="icon" viewBox="0 0 18 18" aria-hidden="true">
            <path
              fill="#4285F4"
              d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z"
            />
            <path
              fill="#34A853"
              d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z"
            />
            <path
              fill="#FBBC05"
              d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z"
            />
            <path
              fill="#EA4335"
              d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z"
            />
          </svg>
          <span class="label-idle">Continue with Google</span>
          <span class="spinner" aria-hidden="true"></span>
          <span class="label-loading" hidden>Connecting…</span>
        </button>

        <footer class="legal">
          <a href="#terms">Terms</a>
          <a href="#privacy">Privacy</a>
        </footer>

        <div class="demo-bar" aria-label="Prototype state toggles">
          <button type="button" data-demo="error">Toggle error</button>
          <button type="button" data-demo="loading">Simulate loading</button>
        </div>
        <p class="note">
          Prototype only — Flutter production screens await approval. Refero-style
          reference (Mobbin waived). OAuth UI: Google only for v1.
        </p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>

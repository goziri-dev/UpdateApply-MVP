# UpdateApply API on Fly.io
# Live app: updateapply-mvp. Create with: fly apps create updateapply-mvp
# (or change `app` below after `fly launch`). Do not hardcode org here.
#
# Deploy from this directory:
#   cd server && fly deploy

app = "updateapply-mvp"
# Must match the live Machine region; min_machines_running only counts primary_region.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# Run Alembic once before Machines get the new image (preferred over migrate-on-start).
[deploy]
  release_command = "uv run alembic upgrade head"

[env]
  APP_NAME = "UpdateApply"
  APP_HOST = "0.0.0.0"
  APP_PORT = "8000"
  # Prefer OS cron / separate Machine for catalog daily; leave false unless you want in-process.
  ENABLE_DAILY_JOB_RUNNER = "false"

[http_service]
  internal_port = 8000
  force_https = true
  # Always-on: disable idle autostop so auth/API never cold-start (~7s).
  # Keep min_machines_running = 1 aligned with primary_region for capacity logic.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

# Optional: persist onboarding resume PDFs across deploys.
#   fly volumes create updateapply_uploads --region iad --size 1
# Then uncomment:
# [[mounts]]
#   source = "updateapply_uploads"
#   destination = "/app/data/uploads"

# FastAPI + LangChain + PyMuPDF + embedding deps need headroom beyond a
# lean ASGI baseline; 256mb OOMs under load. Prefer 1024mb for personal MVP.
[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1

# fly.toml app configuration file generated for updateapply-mvp on 2026-10-25T18:13:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'updateapply-mvp'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'uv run alembic upgrade head'

[env]
  APP_HOST = '0.0.0.0'
  APP_NAME = 'UpdateApply'
  APP_PORT = '8000'
  ENABLE_DAILY_JOB_RUNNER = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

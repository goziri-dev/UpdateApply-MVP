# UpdateApply API on Fly.io
# Placeholder app name — create/rename with: fly apps create updateapply-api
# (or change `app` below after `fly launch`). Do not hardcode org here.
#
# Deploy from this directory:
#   cd server && fly deploy

app = "updateapply-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Run Alembic once before Machines get the new image (preferred over migrate-on-start).
[deploy]
  release_command = "uv run alembic upgrade head"

[env]
  APP_NAME = "UpdateApply"
  APP_HOST = "0.0.0.0"
  APP_PORT = "8000"
  # Prefer OS cron / separate Machine for catalog daily; leave false unless you want in-process.
  ENABLE_DAILY_JOB_RUNNER = "false"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one warm Machine in the primary region so auth/API aren't cold-started every request.
  # Excess capacity can still stop when idle. Set auto_stop_machines = "off" for always-on.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

# Optional: persist onboarding resume PDFs across deploys.
#   fly volumes create updateapply_uploads --region iad --size 1
# Then uncomment:
# [[mounts]]
#   source = "updateapply_uploads"
#   destination = "/app/data/uploads"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
